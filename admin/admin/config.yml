backend:
  name: github
  repo: "asominabrand-maker/steady-finance.html"
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "about"
    label: "Обо мне"
    files:
      - file: "content/about.json"
        label: "Фото профиля"
        name: "about"
        fields:
          - { label: "Фото", name: "photo", widget: "image", required: false }

  - name: "testimonials"
    label: "Отзывы"
    files:
      - file: "content/testimonials.json"
        label: "Список отзывов"
        name: "testimonials"
        fields:
          - label: "Отзывы"
            name: "testimonials"
            widget: "list"
            label_singular: "Отзыв"
            fields:
              - { label: "Текст отзыва", name: "text", widget: "text" }
              - { label: "Автор", name: "author", widget: "string", default: "Клиент" }
              - { label: "Роль / компания", name: "role", widget: "string", required: false }
